<uiView onActivate="
  var ap = -1, p1s = -1, p2s = -1;
  var g1w = 0, g1p1 = 0, g1p2 = 0;
  var g2w = 0, g2p1 = 0, g2p2 = 0;
  var yor = -1, isDbl = 0;

  // Opponent marker: orange 'o' on their service court, faint '.' otherwise.
  function dot(id, filled) {
    setText(id, filled ? 'o' : '.');
    setStyle(id, 'color', filled ? '#FF6600' : '#555555');
  }

  // Your marker is a 'Y' showing where you should stand — orange when you are the
  // server, gray when just standing, a faint '.' when off (the empty court).
  function youDot(id, state) {
    setText(id, state == 'off' ? '.' : 'Y');
    setStyle(id, 'color', state == 'serve' ? '#FF6600' : state == 'stand' ? '#999999' : '#555555');
  }

  function updateCourt() {
    if (ap == -1 || p1s == -1 || p2s == -1) return;

    // Which service court you stand in for the current serve, and whether it is
    // actually you serving (orange) rather than your partner / the opponent.
    var youR, youServing;
    if (isDbl == 1) {
      // Doubles: you keep your side until your pair scores on serve, so always
      // stand on your tracked side - whether serving, receiving or neither.
      youR = (yor == 1);
      youServing = (ap == 1) && ((yor == 1) == (p1s % 2 == 0));
    } else if (ap == 1) {
      // Singles, you serve: from the right court when your score is even.
      youR = (p1s % 2 == 0);
      youServing = true;
    } else {
      // Singles, you receive: diagonally opposite the server (their score).
      youR = (p2s % 2 == 0);
      youServing = false;
    }
    var mine = youServing ? 'serve' : 'stand';
    if (isDbl == 1) {
      // Doubles: your 'Y' marks your court; your partner uses the same marker as
      // an opponent server — a faint '.' when idle, an orange 'o' when it is the
      // partner serving (your side serves but not you). Your partner always
      // stands in the court opposite you.
      var partnerServing = (ap == 1) && !youServing;
      youDot(youR ? '#dot-p1-r' : '#dot-p1-l', mine);
      dot(youR ? '#dot-p1-l' : '#dot-p1-r', partnerServing);
    } else {
      // Singles: only your marker; the other court stays empty.
      youDot('#dot-p1-l', youR ? 'off' : mine);
      youDot('#dot-p1-r', youR ? mine : 'off');
    }

    // Opponent's server marker, shown only while their side is serving.
    if (ap == 2) {
      var oppR = (p2s % 2 == 0);
      dot('#dot-p2-l',  oppR);
      dot('#dot-p2-r', !oppR);
    } else {
      dot('#dot-p2-l', false);
      dot('#dot-p2-r', false);
    }
  }

  // One numeral's width in %, at the sp-d-s size. A single-digit score is
  // nudged right by this so its units digit lines up under a two-digit score
  // (the watch ignores CSS text-align, so we right-align by position — same as
  // the match-over screen).
  var DIGIT_W = 7;

  // Render a finished-game slot at base left L%: opp (p2) on top, separator,
  // you (p1) on the bottom; winner's number orange, loser's gray. Each row is
  // shifted right by DIGIT_W when it is a single digit, keeping the two rows
  // right-aligned.
  function histSlot(topBox, p2id, sepId, botBox, p1id, L, p2val, p1val, winner) {
    setStyle(topBox, 'left', (p2val < 10 ? L + DIGIT_W : L) + '%');
    setStyle(botBox, 'left', (p1val < 10 ? L + DIGIT_W : L) + '%');
    setStyle(sepId, 'left', (L - 1) + '%');
    setStyle(sepId, 'background', '#666666');
    setText(p2id, '' + p2val);
    setText(p1id, '' + p1val);
    setStyle(p2id, 'color', winner == 2 ? '#FF6600' : '#888888');
    setStyle(p1id, 'color', winner == 1 ? '#FF6600' : '#888888');
  }

  function updateHistory() {
    if (g1w == 0) return;
    if (g2w == 0) {
      // One game done: show it in the right slot (h1); left slot (h2) stays hidden.
      histSlot('#h1t', '#h1-p2', '#h1-sep', '#h1b', '#h1-p1', 35, g1p2, g1p1, g1w);
    } else {
      // Two games done: most recent (g2) -> right slot (h1), older (g1) -> left slot (h2).
      histSlot('#h1t', '#h1-p2', '#h1-sep', '#h1b', '#h1-p1', 35, g2p2, g2p1, g2w);
      histSlot('#h2t', '#h2-p2', '#h2-sep', '#h2b', '#h2-p1', 13, g1p2, g1p1, g1w);
    }
  }

  setStyle('#h1-p2',  'color', '#000000');
  setStyle('#h1-p1',  'color', '#000000');
  setStyle('#h1-sep', 'background', '#000000');
  setStyle('#h2-p2',  'color', '#000000');
  setStyle('#h2-p1',  'color', '#000000');
  setStyle('#h2-sep', 'background', '#000000');

  $.subscribe('Zapp/{zapp_index}/Output/activePlayer',    function(v) { ap  = v; setStyle('#p1-block', 'color', v == 1 ? '#FF6600' : '#FFFFFF'); setStyle('#p2-block', 'color', v == 2 ? '#FF6600' : '#FFFFFF'); updateCourt(); });
  $.subscribe('Zapp/{zapp_index}/Output/playerOneScore',  function(v) { p1s = v; updateCourt(); });
  $.subscribe('Zapp/{zapp_index}/Output/playerTwoScore',  function(v) { p2s = v; updateCourt(); });
  $.subscribe('Zapp/{zapp_index}/Output/youOnRight',      function(v) { yor = v; updateCourt(); });
  $.subscribe('Zapp/{zapp_index}/Output/isDoubles',       function(v) { isDbl = v; updateCourt(); });
  $.subscribe('Zapp/{zapp_index}/Output/game1Winner',     function(v) { g1w = v; updateHistory(); });
  $.subscribe('Zapp/{zapp_index}/Output/game1P1Score',    function(v) { g1p1 = v; updateHistory(); });
  $.subscribe('Zapp/{zapp_index}/Output/game1P2Score',    function(v) { g1p2 = v; updateHistory(); });
  $.subscribe('Zapp/{zapp_index}/Output/game2Winner',     function(v) { g2w = v; updateHistory(); });
  $.subscribe('Zapp/{zapp_index}/Output/game2P1Score',    function(v) { g2p1 = v; updateHistory(); });
  $.subscribe('Zapp/{zapp_index}/Output/game2P2Score',    function(v) { g2p2 = v; updateHistory(); });
">
  <div id="suuntoplus">

    <!-- Right history slot: most recently finished game -->
    <div id="h1t" class="sp-vertical-center" style="top:30%;left:35%;">
      <span id="h1-p2" class="sp-d-s">0</span>
    </div>
    <div id="h1-sep" class="cm-fg" style="top:50%;left:34%;width:14%;height:2px;opacity:0.5"></div>
    <div id="h1b" class="sp-vertical-center" style="top:49%;left:35%;">
      <span id="h1-p1" class="sp-d-s">0</span>
    </div>

    <!-- Left history slot: game before that -->
    <div id="h2t" class="sp-vertical-center" style="top:30%;left:13%;">
      <span id="h2-p2" class="sp-d-s">0</span>
    </div>
    <div id="h2-sep" class="cm-fg" style="top:50%;left:12%;width:14%;height:2px;opacity:0.5"></div>
    <div id="h2b" class="sp-vertical-center" style="top:49%;left:13%;">
      <span id="h2-p1" class="sp-d-s">0</span>
    </div>

    <!-- OPP dots: above p2 score -->
    <div class="sp-vertical-center" style="top:12%;left:calc(62% - 50%e);">
      <span id="dot-p2-l" class="sp-t-m">.</span>
    </div>
    <div class="sp-vertical-center" style="top:12%;left:calc(82% - 50%e);">
      <span id="dot-p2-r" class="sp-t-m">.</span>
    </div>

    <!-- P2 score -->
    <div id="p2-block" class="sp-vertical-center" style="top:19%;left:calc(72% - 50%e);">
      <span class="sp-d-l f-num"><eval input="Zapp/{zapp_index}/Output/playerTwoScore" outputFormat="Count_Twodigits" default="0" /></span>
    </div>

    <div class="cm-fg" style="top:calc(50% - 1px);left:calc(72% - 50%e);width:30%;height:2px;opacity:0.5;"></div>

    <!-- P1 score -->
    <div id="p1-block" class="sp-vertical-center" style="top:48%;left:calc(72% - 50%e);">
      <span class="sp-d-l f-num"><eval input="Zapp/{zapp_index}/Output/playerOneScore" outputFormat="Count_Twodigits" default="0" /></span>
    </div>

    <!-- YOUR dots: below p1 score -->
    <div class="sp-vertical-center" style="top:73%;left:calc(62% - 50%e);">
      <span id="dot-p1-l" class="sp-t-m">.</span>
    </div>
    <div class="sp-vertical-center" style="top:73%;left:calc(82% - 50%e);">
      <span id="dot-p1-r" class="sp-t-m">.</span>
    </div>

    <userInput>
      <pushButton name="up"
        onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32'); $.put('/Activity/Trigger', 23);"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 3, null, 'int32');" />
      <pushButton name="down"
        onClick="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32'); $.put('/Activity/Trigger', 23);"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 4, null, 'int32');" />
    </userInput>

  </div>
</uiView>
