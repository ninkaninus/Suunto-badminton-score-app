<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="score.css" />
</head>
<body>
  <!-- Games won row -->
  <div class="games-row">
    <span class="games" id="p1-games">{{playerOneGames}}</span>
    <span class="games-label">games</span>
    <span class="games" id="p2-games">{{playerTwoGames}}</span>
  </div>

  <!-- Main score row -->
  <div class="score-row">
    <!-- Player 1 side — highlighted when active -->
    <div class="player-block {{#if activePlayer === 1}}active{{/if}}" id="p1-block">
      <span class="player-label">YOU</span>
      <span class="score" id="p1-score">{{playerOneScore}}</span>
    </div>

    <div class="divider">–</div>

    <!-- Player 2 side -->
    <div class="player-block {{#if activePlayer === 2}}active{{/if}}" id="p2-block">
      <span class="score" id="p2-score">{{playerTwoScore}}</span>
      <span class="player-label">OPP</span>
    </div>
  </div>

  <!-- Status line (who is serving) -->
  <div class="status" id="status-text">{{statusText}}</div>

  <!-- Hint -->
  <div class="hint">LAP = point  ·  BACK = switch</div>
</body>
</html>
