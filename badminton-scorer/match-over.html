<uiView onActivate="
  var p1s = 0, p2s = 0, g1w = 0, g2w = 0;
  var g1p1 = 0, g1p2 = 0, g2p1 = 0, g2p2 = 0;

  // One numeral's width in %, at the sp-d-s size. A single-digit score is
  // nudged right by this so its units digit lines up under a two-digit score.
  // The watch ignores CSS text-align (it right-aligns fine in the simulator but
  // not on-device), so we right-align by position instead.
  var DIGIT_W = 7;

  // Render a game column at left L%, reusing score.html's history-slot pattern:
  // opp (p2) on top, a thin separator, you (p1) on the bottom; winner's number
  // orange, loser's gray. Each row is shifted right by DIGIT_W when it is a
  // single digit, keeping the two rows right-aligned.
  function renderGame(topBox, p2id, sepId, botBox, p1id, L, p2val, p1val, winner) {
    setStyle(topBox, 'left', (p2val < 10 ? L + DIGIT_W : L) + '%');
    setStyle(botBox, 'left', (p1val < 10 ? L + DIGIT_W : L) + '%');
    setStyle(sepId, 'left', (L - 1) + '%');
    setStyle(sepId, 'background', '#666666');
    setText(p2id, '' + p2val);
    setText(p1id, '' + p1val);
    setStyle(p2id, 'color', winner == 2 ? '#FF6600' : '#888888');
    setStyle(p1id, 'color', winner == 1 ? '#FF6600' : '#888888');
  }

  function update() {
    // Wait until both completed games are known.
    if (g1w == 0 || g2w == 0) return;

    // If the two completed games were split, a third (deciding) game was
    // played; its final score lives in playerOneScore / playerTwoScore. The row
    // is centred for the number of games: three columns spread across the face,
    // or two columns centred on the same axis.
    var threeGames = (g1w != g2w);
    var youWon;

    if (threeGames) {
      renderGame('#g1t', '#g1-p2', '#g1-sep', '#g1b', '#g1-p1', 20, g1p2, g1p1, g1w);
      renderGame('#g2t', '#g2-p2', '#g2-sep', '#g2b', '#g2-p1', 43, g2p2, g2p1, g2w);
      var g3w = (p1s > p2s) ? 1 : 2;
      renderGame('#g3t', '#g3-p2', '#g3-sep', '#g3b', '#g3-p1', 66, p2s, p1s, g3w);
      youWon = (p1s > p2s);
    } else {
      renderGame('#g1t', '#g1-p2', '#g1-sep', '#g1b', '#g1-p1', 32, g1p2, g1p1, g1w);
      renderGame('#g2t', '#g2-p2', '#g2-sep', '#g2b', '#g2-p1', 54, g2p2, g2p1, g2w);
      // Only two games were played: hide the unused third column. Clear its
      // digits and move its divider off-screen. (On-device a black-on-black
      // line still shows faintly and setStyle('opacity',...) doesn't stick, so
      // hide the divider by POSITION, which is reliable — one visible line per
      // completed set.)
      setText('#g3-p2', '');
      setText('#g3-p1', '');
      setStyle('#g3-sep', 'left', '120%');
      youWon = (g1w == 1);
    }

    setText('#winner-line', youWon ? 'YOU WIN' : 'OPP WINS');
    setStyle('#winner-line', 'color', youWon ? '#FF6600' : '#FFFFFF');
  }

  // Hide every column up front (black separators and digits). Games 1 & 2 are
  // always filled by update(); the game-3 column stays hidden unless a third
  // game was actually played.
  setStyle('#g1-p2',  'color', '#000000');
  setStyle('#g1-p1',  'color', '#000000');
  setStyle('#g1-sep', 'background', '#000000');
  setStyle('#g2-p2',  'color', '#000000');
  setStyle('#g2-p1',  'color', '#000000');
  setStyle('#g2-sep', 'background', '#000000');
  setStyle('#g3-p2',  'color', '#000000');
  setStyle('#g3-p1',  'color', '#000000');
  setStyle('#g3-sep', 'background', '#000000');
  setStyle('#g3-sep', 'left', '120%'); // off-screen until a 3rd game is played

  $.subscribe('Zapp/{zapp_index}/Output/game1Winner',    function(v) { g1w = v; update(); });
  $.subscribe('Zapp/{zapp_index}/Output/game2Winner',    function(v) { g2w = v; update(); });
  $.subscribe('Zapp/{zapp_index}/Output/game1P1Score',   function(v) { g1p1 = v; update(); });
  $.subscribe('Zapp/{zapp_index}/Output/game1P2Score',   function(v) { g1p2 = v; update(); });
  $.subscribe('Zapp/{zapp_index}/Output/game2P1Score',   function(v) { g2p1 = v; update(); });
  $.subscribe('Zapp/{zapp_index}/Output/game2P2Score',   function(v) { g2p2 = v; update(); });
  $.subscribe('Zapp/{zapp_index}/Output/playerOneScore', function(v) { p1s = v; update(); });
  $.subscribe('Zapp/{zapp_index}/Output/playerTwoScore', function(v) { p2s = v; update(); });
">
  <div id="suuntoplus">

    <div class="sp-vertical-center p-hc" style="top:8%;">
      <span class="sp-t-m">MATCH OVER</span>
    </div>

    <div class="sp-vertical-center p-hc" style="top:20%;">
      <span id="winner-line" class="sp-t-m">...</span>
    </div>

    <!-- Game columns: opp (p2) top / separator / you (p1) bottom. update()
         re-centres the row's left positions for 2 vs 3 games. -->
    <div id="g1t" class="sp-vertical-center" style="top:30%;left:20%;">
      <span id="g1-p2" class="sp-d-s">0</span>
    </div>
    <div id="g1-sep" class="cm-fg" style="top:50%;left:19%;width:14%;height:2px;opacity:0.5"></div>
    <div id="g1b" class="sp-vertical-center" style="top:49%;left:20%;">
      <span id="g1-p1" class="sp-d-s">0</span>
    </div>

    <div id="g2t" class="sp-vertical-center" style="top:30%;left:43%;">
      <span id="g2-p2" class="sp-d-s">0</span>
    </div>
    <div id="g2-sep" class="cm-fg" style="top:50%;left:42%;width:14%;height:2px;opacity:0.5"></div>
    <div id="g2b" class="sp-vertical-center" style="top:49%;left:43%;">
      <span id="g2-p1" class="sp-d-s">0</span>
    </div>

    <div id="g3t" class="sp-vertical-center" style="top:30%;left:66%;">
      <span id="g3-p2" class="sp-d-s">0</span>
    </div>
    <div id="g3-sep" class="cm-fg" style="top:50%;left:65%;width:14%;height:2px;opacity:0.5"></div>
    <div id="g3b" class="sp-vertical-center" style="top:49%;left:66%;">
      <span id="g3-p1" class="sp-d-s">0</span>
    </div>

    <div class="sp-vertical-center p-hc" style="top:74%;">
      <span class="sp-b-s">hold ^ new match</span>
    </div>
    <div class="sp-vertical-center p-hc" style="top:84%;">
      <span class="sp-b-s">hold v undo</span>
    </div>

    <userInput>
      <!-- Neither button defines onClick, so a *tap* falls through to the
           watch's native exercise controls (tap up = pause, then tap down =
           stop & save). The app overrides only the *holds*: hold up = new
           match (wipes this match), hold down = undo the last point (re-opens
           the match). Both app actions require a hold, so a stray tap can't
           trigger them and the native stop keeps working. -->
      <pushButton name="up"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');" />
      <pushButton name="down"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 4, null, 'int32');" />
    </userInput>

  </div>
</uiView>
